[project]
name = "arxiv-papers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx[socks]>=0.28.1",
    "lxml>=6.1.3",
    "mcp[cli]>=2.2.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "zstandard>=0.25.0",
]

[project.scripts]
arxiv-papers = "arxiv_papers:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]
